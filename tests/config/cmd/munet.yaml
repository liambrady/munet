version: 1
topology:
  nodes:
    - name: h-shcmd
      cmd: echo foo
    - name: h-shcmd-file
      cmd-file: "cmd.sh"
    - name: h-pycmd
      cmd: print("foo")
      shell: "/usr/bin/python3"
    - name: h-pycmd-file
      cmd-file: "pycmd.py"
    - name: h-shcmd-file-noshebang
      cmd-file: "cmd-noshebang.sh"

    - name: h-composed
      kind: composed
      cmd: |
        test -f %RUNDIR%/kind-ready && echo node
      cleanup-cmd: echo node >> %RUNDIR%/cleanup-order

kinds:
  - name: composed
    merge: [commands]
    cmd: |
      echo kind
      touch %RUNDIR%/kind-ready
      exec sleep 60
    ready-cmd: test -f %RUNDIR%/kind-ready
    cleanup-cmd: echo kind >> %RUNDIR%/cleanup-order
