topology:
  ipv6-enable: false
  networks-autonumber: true
  dns-network: "mgmt0"
  networks:
    - name: mgmt0
      ip: 192.168.0.254/24
      nat: true
  nodes:
    - name: h1
      connections:
        - to: "mgmt0"
        - to: "r1"
          ip: 10.0.1.1/24
        - to: "r2"
          ip: 10.0.2.1/24
    - name: r1
      kind: disk-linux-from-file
      cmd-file: "cmd-qemu.py"
      qemu:
        initial-cmd: touch /root/ignored-initializer
      shell: /usr/bin/python3
      ready-cmd: |
        from pathlib import Path
        raise SystemExit(not Path("/root/foo").exists())
      cleanup-cmd: |
        from pathlib import Path
        Path("/root/cleanup-order").write_text("node\n")
      connections:
        - to: "mgmt0"
        - to: "h1"
          ip: 10.0.1.2/24
    - name: r2
      kind: disk-linux
      cmd: "touch ~/foo"
      ready-cmd: test -f /root/foo -a -f /root/bar
      connections:
        - to: "mgmt0"
        - to: "h1"
          ip: 10.0.2.2/24

    - name: existing-disk
      kind: disk-linux-existing
      connections: []
      ready-cmd: test ! -f /root/unexpected-initializer

kinds:
  - name: disk-linux-from-file
    merge: [commands, qemu]
    shell: /bin/sh
    cmd: test -f /root/bar && touch /root/kind-ready
    ready-cmd: test -f /root/kind-ready
    cleanup-cmd: echo kind >> /root/cleanup-order
    ssh-identity-file: "%RUNDIR%/../root-key"
    ssh-user: "root"
    qemu:
      disk-template: "%CONFIGDIR%/ubuntu-tpl.qcow2"
      cloud-init: true
      cloud-init-disk: "%RUNDIR%/../%NAME%-config-cmd.img"
      initial-cmd-file: "cmd-initial-qemu.sh"
      console:
        user: "root"
        password: "foobar"
        timeout: 3600
      memory: "1G"
      kvm: true
      ncpu: 2
  - name: disk-linux
    qemu:
      disk-template: "%CONFIGDIR%/ubuntu-tpl.qcow2"
      cloud-init: true
      cloud-init-disk: "%RUNDIR%/../%NAME%-config-cmd.img"
      initial-cmd: "touch ~/bar"
      console:
        stdio: false
        user: "root"
        password: "foobar"
        timeout: 3600
      memory: "1G"
      kvm: true
      ncpu: 2

  - name: disk-linux-existing
    qemu:
      disk-template: "%CONFIGDIR%/ubuntu-tpl.qcow2"
      disk: "%RUNDIR%/../existing.qcow2"
      cloud-init: true
      cloud-init-disk: "%RUNDIR%/../existing-disk-config-cmd.img"
      initial-cmd: touch /root/unexpected-initializer
      console:
        user: root
        password: foobar
        timeout: 3600
      memory: 1G
      kvm: true

cli:
  commands:
    - name: con
      exec: "socat /dev/stdin,rawer,escape=0x1d,,echo=0,icanon=0 unix-connect:%RUNDIR%/s/vcon0"
      format: "con HOST [HOST ...]"
      help: "open console on given hosts, * for all"
      new-window: true
      top-level: true
    - name: mon
      exec: "socat /dev/stdin,rawer,escape=0x1d,,echo=0,icanon=0 unix-connect:%RUNDIR%/s/monitor"
      format: "mon NODE [NODE ...]"
      help: "open monitor on given hosts, * for all"
      new-window: true
      top-level: true
    - name: ssh
      exec: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null %IPADDR%"
      kinds: ["disk-linux", "disk-linux-from-file"]
      format: "ssh NODE [NODE ...]"
      top-level: true
      new-window: true
    - name: sship
      exec: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {}"
      format: "sship [user@]ip-addr"
      top-level: true
      new-window: true
    - name: vtysh
      exec: "expect -c 'spawn ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null %IPADDR% ; expect \"assword:\"; send \"\n\"; interact'"
      format: "vtysh NODE"
      top-level: true
      new-window: true
